          description: |-
            GET /api/v2/donors/funds

            Requerido: businessPartnerIds (repetir el parametro para enviar varios, max 25).
            Opcionales: consolidate (def false; true consolida los fondos compartidos por Fund Code), search, expand (sectors|fundTotals), fromCreationDate, toCreationDate (M/d/yyyy o yyyy-MM-dd), status (active|terminate|expired), page (def 1), pageSize (def 10, max 50), sortBy (fundName|fundCode|fundType|creationDate|closedDate|fundCurrency|status, def fundName), order (asc|desc, def asc)
          sortKey: -1000
        method: GET
        parameters:
          - name: businessPartnerIds
            value: "{{ _.bpIds4 }}"
            disabled: false
          - name: businessPartnerIds
            value: "600001"
            disabled: true
          - name: consolidate
            value: "true"
            disabled: false
            type: text
            multiline: false
          - name: search
            value: climate
            disabled: true
          - name: expand
            value: sectors
            disabled: true
          - name: expand
            value: fundTotals
            disabled: true
