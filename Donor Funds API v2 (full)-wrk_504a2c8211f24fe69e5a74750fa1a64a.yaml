          - name: order
            value: desc
            disabled: true
          - name: page
            value: "1"
            disabled: true
          - name: pageSize
            value: "10"
            disabled: true
        headers:
          - name: Accept
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
