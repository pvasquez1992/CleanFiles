          id: req_940ef3dd92c940d687b70c7d613a3eb0
          created: 1790264375748
          modified: 1790955856249
          isPrivate: false
          description: >-
            GET /api/v2/donors/funds/summary


            Requerido: businessPartnerIds.

            Opcionales: consolidate (true = un solo item en data, sin duplicar
            fondos compartidos), fundCode.


            Los BP sin fondos que matcheen los filtros vuelven en notFound. El
            404 solo aparece si NINGUN BP tiene fondos.
          sortKey: -990
        method: GET
