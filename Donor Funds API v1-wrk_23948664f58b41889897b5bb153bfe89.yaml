          isPrivate: false
          description: >-
            GET /api/v1/donors/{donorId}/funds


            Listado paginado de fondos del donante.


            Opcionales: search, expand (sectors|fundTotals), fromCreationDate,
            toCreationDate (M/d/yyyy o yyyy-MM-dd), status
            (active|terminate|expired), page (def 1), pageSize (def 10, max 50),
            sortBy (fundName|fundCode|fundType|creationDate|status), order
            (asc|desc, def asc)


            OJO: el swagger lista closedDate y fundCurrency como sortBy validos,
            pero el validator del codigo solo acepta fundName, fundCode,
            fundType, creationDate y status.
          sortKey: -1000
        method: GET
        parameters:
          - name: search
            value: climate
            disabled: true
          - name: expand
            value: sectors
            disabled: true
          - name: expand
            value: fundTotals
            disabled: true
          - name: fromCreationDate
            value: 2020-01-01
            disabled: true
          - name: toCreationDate
            value: 2025-12-31
            disabled: true
          - name: status
            value: active
            disabled: true
