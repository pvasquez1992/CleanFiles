spec:
  contents:
    openapi: 3.0.4
    info:
      title: Resource Mobilization Business Donor Funds API
      description: Resource Mobilization Business API for providing access to Donor
        Funds data.
      version: "2.0"
    servers:
      - url: https://api-np-d-app-service-fundscsdf.azurewebsites.net
    paths:
      /api/v2/donors/funds:
        get:
          tags:
            - Donors
          summary: Retrieves a list of funds for the specified business partner ids and
            filters.
          description: "## Examples\r

            \            \r

            ### Basic request:\r

            The following example will retrieve the first 10 Funds for Business
            Partner Ids `600000` and `600001` (default pagination settings):\r

            ```html\r

            GET /api/v1/donors/funds?businessPartnerIds=[600000,600001]\r

            ```\r

            - **Note:** Default pagination values: `page=1`, `pageSize=10`\r

            \            \r

            ### Consolidated request:\r

            The following example will retrieve the first 10 Funds for Business
            Partner Ids `600000` and `600001` and will consolidate the results
            by Fund Code:\r

            ```html\r

            GET
            /api/v1/donors/funds?businessPartnerIds=[600000,600001]&consolidate\
            =true\r

            ```\r

            \            \r

            ### Paginated request:\r

            The following example will retrieve 10 Funds for Business Partner
            Ids `600000` and `600001` and will include pagination:\r

            ```html\r

            GET
            /api/v1/donors/funds?businessPartnerIds=[600000,600001]&page=3&page\
            Size=5\r

            ```\r

            - **Note:** It is not mandatory to include both pagination
            properties.\r

            \            \r

            ## Permissions\r

            \            \r

            Delegates:\r

            - `DonorFundScope`\r

            \            \r

            App Roles:\r

            - `DonorFundRole`"
          parameters:
            - name: businessPartnerIds
              in: query
              description: One or multiple Business Partner IDs. Maximum `25`. Duplicate IDs
                are ignored.
              required: true
              schema:
                type: array
                items:
                  type: string
            - name: consolidate
              in: query
              description: Default `false`. If `false`, Funds are returned independently per
                BP. If `true`, shared Funds are consolidated.
              schema:
                type: boolean
            - name: search
              in: query
              description: When supplied, will get Funds whose name or code contains the
                specified text (case-insensitive)
              schema:
                type: string
            - name: expand
              in: query
              description: "When supplied, will include the specified related entities in the
                response\r

                (case-insensitive; values: `sectors`, `fundTotals`)"
              schema:
                type: array
                items:
                  type: string
            - name: fromCreationDate
              in: query
              description: "When supplied, will get Funds that were created on or after the
                specified date\r

                (formats: `M/d/yyyy`, `yyyy-MM-dd`)"
              schema:
                type: string
                format: date
            - name: toCreationDate
              in: query
              description: "When supplied, will get Funds that were created on or before the
                specified date\r

                (formats: `M/d/yyyy`, `yyyy-MM-dd`)"
              schema:
                type: string
                format: date
            - name: status
              in: query
              description: "When supplied, will get Funds that are in the specified status\r

                (case-insensitive; values: `active`, `terminate`, `expired`)"
              schema:
                type: string
            - name: page
              in: query
              description: "Page number (default: `1`)"
              schema:
                type: integer
                format: int32
            - name: pageSize
              in: query
              description: "Page size (default: `10`, max: `50`)"
              schema:
                type: integer
                format: int32
            - name: sortBy
              in: query
              description: "Specifies the field by which the results will be sorted
                (case-insensitive, default: `fundName`)\r

                \r

                Valid values: `fundName`, `fundCode`, `fundType`,
                `creationDate`, `closedDate`, `fundCurrency`, `status`"
              schema:
                type: string
            - name: order
              in: query
              description: "Specifies the sorting order (values: `asc`, `desc`, default:
                `asc`)"
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/PaginatedResponseOfGetFundsByIdsResponseItem"
            "400":
              description: Bad Request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails"
            "404":
              description: Not Found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
      /api/v2/donors/funds/summary:
        get:
          tags:
            - Donors
          summary: Retrieves a summary of funds for the specified business partner ids and
            filters.
          description: "## Examples\r

            \            \r

            ### Basic request:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001`,\r

            with one item in `data` per Business Partner Id:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]\r

            ```\r

            \            \r

            ### Consolidated request:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001`\r

            consolidated by Fund Code into a single `data` item, without
            double-counting funds shared between them:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]&con\
            solidate=true\r

            ```\r

            \            \r

            ### Request by FundCode:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001` and will specify the Fund Code
            `ABC`:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]&fun\
            dCode=ABC\r

            ```\r

            - **Note:** Any Business Partner Id without funds matching the
            applied filters is returned in `notFound`.\r

            A 404 response is returned only when none of the requested Business
            Partner Ids have matching funds.\r

            \            \r

            ## Permissions\r

            \            \r

            Delegates:\r

            - `DonorFundScope`\r

            \            \r

            App Roles:\r

            - `DonorFundRole`"
          parameters:
            - name: businessPartnerIds
              in: query
              description: One or multiple Business Partner IDs. Maximum `25`. Duplicate IDs
                are ignored.
              required: true
              schema:
                type: array
                items:
                  type: string
            - name: consolidate
              in: query
              description: "When supplied, will consolidate the response by Funds or not
                (case-insensitive; values: `true`, `false`)"
              schema:
                type: boolean
            - name: fundCode
              in: query
              description: Optional filter to retrieve funds summary by Fund Code.
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/IDB.RSMB.Business.DonorFunds.Application.Features.D\
                      onors.V2.GetFundsSummaryByIds.GetFundsSummaryByIdsRespons\
                      e"
            "400":
              description: Bad Request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails"
            "404":
              description: Not Found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
      /api/v2/donors/fund-projects-summary:
        get:
          tags:
            - Donors
          summary: Retrieves a summary of fund projects for the specified business partner
            ids and filters.
          description: "## Examples\r

            \r

            ### Basic request:\r

            The following example will retrieve a summary of Fund Projects for
            `businessPartnerIds=[600000,600001]` and `fundCodes=ABC`:\r

            ```html\r

            GET
            /api/v1/donors/fund-projects-summary?businessPartnerIds=[600000,600\
            001]&fundCodes=ABC\r

            ```\r

            - **Note:** Default pagination values: `page=1`, `pageSize=10`\r

            \r

            ### Consolidated request:\r

            The following example will retrieve a summary of Fund Projects for
            `businessPartnerIds=[600000,600001]`, `fundCodes=ABC` and will
            consolidate the results by Fund Project Code:\r

            ```html\r

            GET
            /api/v1/donors/fund-projects-summary?businessPartnerIds=[600000,600\
            001]&fundCodes=ABC&consolidate=true\r

            ```\r

            \r

            ## Permissions\r

            \r

            Delegates:\r

            - `DonorFundScope`\r

            \r

            App Roles:\r

            - `DonorFundRole`"
          parameters:
            - name: businessPartnerIds
              in: query
              description: One or multiple Business Partner IDs. Maximum `25`. Duplicate IDs
                are ignored.
              required: true
              schema:
                type: array
                items:
                  type: integer
                  format: int32
            - name: fundCodes
              in: query
              description: One or multiple Fund Codes used to calculate the summary.
              required: true
              schema:
                type: array
                items:
                  type: string
            - name: consolidate
              in: query
              description: Default `false`. If `false`, returns one summary per BP. If `true`,
                returns one consolidated summary.
              schema:
                type: boolean
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/IDB.RSMB.Business.DonorFunds.Application.Features.D\
                      onors.V2.GetFundProjectsSummaryByIds.GetFundProjectsSumma\
                      ryByIdsResponse"
            "400":
              description: Bad Request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails"
            "404":
              description: Not Found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
      /api/v2/donors/project-specific-grants:
        get:
          tags:
            - Donors
          summary: Retrieves a list of project-specific grants for the specified business
            partner ids and filters.
          description: "## Examples\r

            \r

            ### Basic request:\r

            ```html\r

            GET
            /api/v1/donors/project-specific-grants?businessPartnerIds=[600000,6\
            00001]\r

            ```\r

            \r

            ### Consolidated request:\r

            ```html\r

            GET
            /api/v1/donors/project-specific-grants?businessPartnerIds=[600000,6\
            00001]&consolidate=true\r

            ```\r

            \r

            ### Request with pagination:\r

            ```html\r

            GET
            /api/v1/donors/project-specific-grants?businessPartnerIds=[600000,6\
            00001]&page=1&pageSize=10\r

            ```\r

            \r

            ## Permissions\r

            \r

            Delegates:\r

            - `DonorFundScope`\r

            \r

            App Roles:\r

            - `DonorFundRole`"
          parameters:
            - name: businessPartnerIds
              in: query
              description: One or multiple Business Partner IDs. Maximum `25`. Duplicate IDs
                are ignored.
              required: true
              schema:
                type: array
                items:
                  type: integer
                  format: int32
            - name: consolidate
              in: query
              description: Default `false`. Determines whether PSGs are returned per BP or
                consolidated.
              schema:
                type: boolean
            - name: search
              in: query
              description: When specified, will filter the results to those that match the
                search term in any of the relevant fields.
              schema:
                type: string
            - name: fromApprovalDate
              in: query
              description: When specified, will filter the results to those with an approval
