  - name: Donors
    meta:
      id: fld_4fda0b7956fe4f9fa6598503d06c7561
      created: 1790695933453
      modified: 1790695933453
      sortKey: -1790695933453
      description: ""
    children:
      - url: "{{ _.base_url }}/api/v2/donors/funds"
        name: Retrieves a list of funds for the specified business partner ids and
          filters.
        meta:
          id: req_2e68e6d0f1e844139cc66585fd295d14
          created: 1790695933454
          modified: 1790695933454
          isPrivate: false
          description: "## Examples\r

            \            \r

            ### Basic request:\r

            The following example will retrieve the first 10 Funds for Business
            Partner Ids `600000` and `600001` (default pagination settings):\r

            ```html\r

            GET /api/v1/donors/funds?businessPartnerIds=[600000,600001]\r

            ```\r

            - **Note:** Default pagination values: `page=1`, `pageSize=10`\r

            \            \r

            ### Consolidated request:\r

            The following example will retrieve the first 10 Funds for Business
            Partner Ids `600000` and `600001` and will consolidate the results
            by Fund Code:\r

            ```html\r

            GET
            /api/v1/donors/funds?businessPartnerIds=[600000,600001]&consolidate\
            =true\r

            ```\r

            \            \r

            ### Paginated request:\r

            The following example will retrieve 10 Funds for Business Partner
            Ids `600000` and `600001` and will include pagination:\r

            ```html\r

            GET
            /api/v1/donors/funds?businessPartnerIds=[600000,600001]&page=3&page\
            Size=5\r

            ```\r

            - **Note:** It is not mandatory to include both pagination
            properties.\r

            \            \r

            ## Permissions\r

            \            \r

            Delegates:\r

            - `DonorFundScope`\r

            \            \r

            App Roles:\r

            - `DonorFundRole`"
          sortKey: -1790695933454
        method: GET
        parameters:
          - name: businessPartnerIds
            value: string
            disabled: false
          - name: consolidate
            value: "true"
            disabled: true
          - name: search
            value: string
            disabled: true
          - name: expand
            value: string
            disabled: true
          - name: fromCreationDate
            value: string
            disabled: true
          - name: toCreationDate
            value: string
            disabled: true
          - name: status
            value: string
            disabled: true
          - name: page
            value: "0"
            disabled: true
          - name: pageSize
            value: "0"
            disabled: true
          - name: sortBy
            value: string
            disabled: true
          - name: order
            value: string
            disabled: true
        authentication:
          type: bearer
          token: "{{ _.bearerToken }}"
          prefix: ""
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/api/v2/donors/funds/summary"
        name: Retrieves a summary of funds for the specified business partner ids and
          filters.
        meta:
          id: req_2ab88afc512f4722a29b8e9f96a58ec2
          created: 1790695933455
          modified: 1790695933455
          isPrivate: false
          description: "## Examples\r

            \            \r

            ### Basic request:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001`,\r

            with one item in `data` per Business Partner Id:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]\r

            ```\r

            \            \r

            ### Consolidated request:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001`\r

            consolidated by Fund Code into a single `data` item, without
            double-counting funds shared between them:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]&con\
            solidate=true\r

            ```\r

            \            \r

            ### Request by FundCode:\r

            The following example will retrieve a summary of Funds for Business
            Partner Ids `600000` and `600001` and will specify the Fund Code
            `ABC`:\r

            ```html\r

            GET
            /api/v1/donors/funds/summary?businessPartnerIds=[600000,600001]&fun\
            dCode=ABC\r

            ```\r

            - **Note:** Any Business Partner Id without funds matching the
            applied filters is returned in `notFound`.\r

            A 404 response is returned only when none of the requested Business
            Partner Ids have matching funds.\r

            \            \r

            ## Permissions\r

            \            \r

            Delegates:\r

            - `DonorFundScope`\r

            \            \r

            App Roles:\r

            - `DonorFundRole`"
          sortKey: -1790695933455
        method: GET
        parameters:
          - name: businessPartnerIds
            value: string
            disabled: false
          - name: consolidate
            value: "true"
            disabled: true
          - name: fundCode
            value: string
            disabled: true
        authentication:
          type: bearer
          token: "{{ _.bearerToken }}"
          prefix: ""
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/api/v2/donors/fund-projects-summary"
        name: Retrieves a summary of fund projects for the specified business partner
          ids and filters.
        meta:
          id: req_78f8cdf9bfc745a685ab3d33ce3a7b2f
          created: 1790695933456
          modified: 1790695933456
          isPrivate: false
          description: "## Examples\r

            \r

            ### Basic request:\r

            The following example will retrieve a summary of Fund Projects for
            `businessPartnerIds=[600000,600001]` and `fundCodes=ABC`:\r

